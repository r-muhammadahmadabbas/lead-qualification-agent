[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-qualification-agent"
version = "1.0.0"
description = "LangGraph agent that validates, researches and qualifies inbound client inquiries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Ahmad Abbas" }]
keywords = ["langgraph", "agents", "lead-qualification", "fastapi"]
dependencies = [
    "litellm>=1.40",
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
lead-qualifier = "lead_qualifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
